name: Deploy InfraWatch Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/infrawatch"
            REPO_URL="https://github.com/maheshgajjela221/infra-watch.git"
            BRANCH="main"

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-plugin git
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              cd /home/ubuntu
              sudo rm -rf infrawatch
              git clone -b "$BRANCH" "$REPO_URL" infrawatch
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            cat > backend/.env <<'EOF'
            ${{ secrets.BACKEND_ENV }}
            EOF

            sudo docker compose -p infrawatch-prod down
            sudo docker compose -p infrawatch-prod up -d --build
            sudo docker image prune -f
            sudo docker ps
